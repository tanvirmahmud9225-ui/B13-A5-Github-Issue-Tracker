<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issues Tracker</title>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


    <!-- DaisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <!-- link css -->
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

    <!-- Header-section -->
    <header>
        <div class="px-20 flex justify-between items-center py-4 border-b-2 border-gray-300">
            <div class="flex justify-center items-center gap-2">
                <img class="w-10" src="./assets/github-logo.png" alt="">
                <h2 class="text-2xl font-bold">GitHub Issues Tracker</h2>
            </div>
            <div class="flex justify-center items-center gap-5">
                <div id="input-search" class="">
                    <label class="input">
                        <input id="input-issue" type="search" required placeholder="Search" />
                    </label>
                </div>
                <div>
                    <button id="search-issues" class="btn btn-primary">Search</button>
                </div>
            </div>
        </div>
    </header>



    <!-- main part -->
    <main>
        <section class="mt-10 mb-7">
            <div class="w-9/12 mx-auto flex items-center bg-gray-100 gap-4 shadow-sm py-4 px-5 ">
                <button id="all-issue-btn" class="btn btn-primary issue-btn">All</button>
                <button id="open-issue-btn" class="btn issue-btn">Open</button>
                <button id="closed-issue-btn" class="btn issue-btn">Closed</button>
            </div>
        </section>



        <section>
            <div class="w-9/12 mx-auto">
                <div
                    class=" flex gap-3 justify-between items-center shadow-sm px-5 py-3 bg-gray-100 border-b-2 border-gray-400">
                    <div class="flex gap-3 justify-center items-center">
                        <img class="bg-sky-200 rounded-full p-2" src="./assets/Aperture.png" alt="">
                        <div>
                            <h2 class="text-2xl font-bold"><span id="totalIssue">50</span> Issues</h2>
                            <p class="text-gray-500">Track and manage your project issues</p>
                        </div>
                    </div>
                    <div class="flex gap-3 justify-center items-center">
                        <div class="flex gap-3 justify-center items-center">
                            <i id="open" class="fa-solid fa-circle text-success"></i>
                            <p>Open</p>
                        </div>
                        <div class="flex gap-3 justify-center items-center">
                            <i id="closed" class="fa-solid fa-circle text-primary"></i>
                            <p>Closed</p>
                        </div>
                    </div>
                </div>



                <!--Loading-Spinner -->
                <div id="loadingSpinner" class="hidden justify-center items-center h-[60vh]">
                    <span class="loading loading-dots loading-xl"></span>
                </div>



                <!-- card body -->
                <div id="issue-container"
                    class="grid gap-3 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 px-4 py-3 pb-12 bg-red-50">



                </div>

            </div>



        </section>

    </main>







    <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
    <dialog id="issue_modal" class="modal">
        <div class="modal-box">
            <div id="details-issue-container" class="space-y-6">

            </div>
            <div class="modal-action">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn btn-primary">Close</button>
                </form>
            </div>
        </div>
    </dialog>







    <script src="./script/script.js"></script>
</body>

</html>
