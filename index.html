<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>

    <div class="flex justify-center items-center h-[100vh]">
        <div class="card bg-base-100 w-full max-w-md shrink-0 shadow-2xl p-8">
            <div class="flex justify-center items-center flex-col space-y-3 mb-6">
                <img src="./assets/github-logo.png" alt="">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">GitHub Issues Tracker</h2>
                    <p>Sign in to manage your issues</p>
                </div>
            </div>
            <div class="">
                <div class="space-y-1">
                    <label class="label text-gray-700 text-xl font-bold">Username</label>
                    <input id="input-user" type="text" class="input w-full" placeholder="Enter Username" />
                    <p class="text-primary">Default: admin</p>
                </div>




                <div class="space-y-1">
                    <label class="label mt-5 text-gray-700 text-xl font-bold">Password</label>
                    <input id="input-pass" type="password" class="input w-full" placeholder="Password" />
                    <p class="text-primary">Default: admin123</p>
                </div>

                <button id="sign-in" class="btn btn-primary mt-4 w-full">Sign In</button>
            </div>

            <div class="divider">OR</div>

            <div class="mt-7">
                <h4 class="text-center mb-8">Demo Credentials:</h4>
                <div class="text-center text-lg"><span class="font-bold">Username:</span> admin</div>
                <div class="text-center text-lg"><span class="font-bold">Password:</span> admin123</div>
            </div>
        </div>
    </div>








    <script>
        document.getElementById("sign-in").addEventListener('click', () => {
            const input = document.getElementById("input-user")
            const inputUser = input.value;

            const passInput = document.getElementById("input-pass");
            const pin = passInput.value;

            if (inputUser === "admin" && pin === "admin123") {
                alert("Logged In Successfully")
                window.location.replace("./main.html")
            } else {
                alert("Your pin is unvalid")
            }
        })

    </script>
    <!-- <script src="./script.js"></script> -->
</body>

</html>
